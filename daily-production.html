<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Production | Greenloop FZC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f3f7f4;color:#163d2d}header{padding:15px 8%;background:#0b5b38;color:#fff;font-size:22px;font-weight:bold}.logo{width:55px;height:42px;vertical-align:middle;object-fit:contain;margin-right:12px}nav{padding:14px 8%;background:#e5f3ea}nav a{background:#fff;color:#0b5b38;padding:10px 16px;margin-right:8px;border-radius:7px;text-decoration:none;font-weight:bold}main{max-width:1200px;margin:auto;padding:30px 20px}.box{background:#fff;padding:25px;margin-top:22px;border-radius:14px;box-shadow:0 4px 18px #0002;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #cfd8d2;border-radius:8px}.actions{display:flex;gap:6px}.actions select{flex:1}button{border:0;border-radius:8px;color:#fff;font-weight:bold;cursor:pointer}.add{background:#0b5b38;padding:0 12px;font-size:20px}.remove,.delete{background:#d84343;padding:7px 10px}.save{background:#168653;padding:13px 28px;margin-top:22px}.info{background:#e7f5ec;padding:15px;border-radius:8px;margin-top:18px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:center}th{background:#0b5b38;color:#fff}
</style>
</head>
<body>
<header><img src="looplogo.jpg" class="logo">Greenloop FZC</header>
<nav>
<a href="dashboard.html">← Dashboard</a>
<a href="index.html">⌂ Home / Login</a>
<a href="production-report.html">📊 Reports</a>
</nav>

<main>
<h1>Daily Production</h1>

<div class="box">
<div class="grid">
<div><label>Date</label><input type="date" id="date"></div>

<div><label>Model</label><div class="actions">
<select id="model"></select><button class="add" onclick="addOption('model')">+</button><button class="remove" onclick="deleteOption('model')">−</button>
</div></div>

<div><label>Storage / GB</label><div class="actions">
<select id="storage"></select><button class="add" onclick="addOption('storage')">+</button><button class="remove" onclick="deleteOption('storage')">−</button>
</div></div>

<div><label>Color</label><div class="actions">
<select id="color"></select><button class="add" onclick="addOption('color')">+</button><button class="remove" onclick="deleteOption('color')">−</button>
</div></div>

<div><label>Grade</label><div class="actions">
<select id="grade"></select><button class="add" onclick="addOption('grade')">+</button><button class="remove" onclick="deleteOption('grade')">−</button>
</div></div>

<div><label>Produced Quantity</label><input type="number" id="productionQty" min="0"></div>
<div><label>Export / Out Quantity</label><input type="number" id="exportQty" min="0" value="0"></div>
</div>

<div class="info"><strong>Calculated Day End Stock:</strong> <span id="preview">0</span> units</div>
<button class="save" onclick="saveRecord()">Save Daily Production</button>
</div>

<div class="box">
<h2>Daily Production Records</h2>
<table>
<thead><tr><th>Date</th><th>Model</th><th>GB</th><th>Color</th><th>Grade</th><th>Production</th><th>Export</th><th>Day End Stock</th><th>Delete</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>

<script>
const db=window.supabase.createClient(
'https://ohvplvdxflmgqoptwftk.supabase.co',
'sb_publishable_XLlrS0fJoxZTVJkZg46GzA_KnPPPHnH'
);

const pass='1213';
let records=[];
const defaults={
model:['iPhone 13','Samsung S23'],
storage:['-','64 GB','128 GB','256 GB'],
color:['-','Black','White','Blue','Green'],
grade:['A','B','Bulges A','Bulges B']
};

const norm=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();

function loadOptions(id){
  const saved=localStorage.getItem(id+'Options');
  const list=saved?JSON.parse(saved):defaults[id];
  const unique=[];
  list.forEach(x=>{if(!unique.some(y=>norm(y)===norm(x)))unique.push(x.trim())});
  localStorage.setItem(id+'Options',JSON.stringify(unique));
  document.getElementById(id).innerHTML=unique.map(x=>`<option value="${x}">${x}</option>`).join('');
}

function addOption(id){
  const value=prompt('Enter new option:');
  if(!value||!value.trim())return;
  const list=JSON.parse(localStorage.getItem(id+'Options'))||[];
  const existing=list.find(x=>norm(x)===norm(value));
  if(existing){document.getElementById(id).value=existing;return}
  list.push(value.trim());
  localStorage.setItem(id+'Options',JSON.stringify(list));
  loadOptions(id);
  document.getElementById(id).value=value.trim();
  previewStock();
}

function deleteOption(id){
  if(prompt('Enter delete password:')!==pass){alert('Incorrect password.');return}
  const value=document.getElementById(id).value;
  const list=(JSON.parse(localStorage.getItem(id+'Options'))||[]).filter(x=>norm(x)!==norm(value));
  localStorage.setItem(id+'Options',JSON.stringify(list));
  loadOptions(id);
  previewStock();
}

function previousStock(){
  const list=records.filter(r=>
    r.record_date<date.value &&
    norm(r.model)===norm(model.value) &&
    norm(r.storage)===norm(storage.value) &&
    norm(r.color)===norm(color.value) &&
    norm(r.grade)===norm(grade.value)
  ).sort((a,b)=>b.record_date.localeCompare(a.record_date));

  return list.length?Number(list[0].closing_stock)||0:0;
}

function previewStock(){
  preview.textContent=previousStock()+(Number(productionQty.value)||0)-(Number(exportQty.value)||0);
}

async function loadRecords(){
  const {data,error}=await db.from('production_records').select('*').order('record_date',{ascending:false});
  if(error){alert(error.message);return}
  records=data||[];
  showRecords();
  previewStock();
}

async function saveRecord(){
  const p=Number(productionQty.value);
  const e=Number(exportQty.value)||0;

  if(!date.value||Number.isNaN(p)){alert('Please enter Date and Produced Quantity.');return}

  const old=records.find(r=>
    r.record_date===date.value &&
    norm(r.model)===norm(model.value) &&
    norm(r.storage)===norm(storage.value) &&
    norm(r.color)===norm(color.value) &&
    norm(r.grade)===norm(grade.value)
  );

  const opening=old?Number(old.opening_stock)||0:previousStock();
  const totalP=(old?Number(old.production)||0:0)+p;
  const totalE=(old?Number(old.export_qty)||0:0)+e;
  const closing=opening+totalP-totalE;

  if(closing<0){alert('Export quantity is more than available stock.');return}

  const data={
    record_date:date.value,model:model.value,storage:storage.value,
    color:color.value,grade:grade.value,production:totalP,
    export_qty:totalE,opening_stock:opening,closing_stock:closing
  };

  const result=old
    ?await db.from('production_records').update(data).eq('id',old.id)
    :await db.from('production_records').insert(data);

  if(result.error){alert(result.error.message);return}

  productionQty.value='';
  exportQty.value='0';
  await loadRecords();
}

function showRecords(){
  rows.innerHTML=records.map(r=>`
  <tr>
    <td>${r.record_date}</td><td>${r.model}</td><td>${r.storage}</td>
    <td>${r.color}</td><td>${r.grade}</td><td>${r.production}</td>
    <td>${r.export_qty}</td><td><strong>${r.closing_stock}</strong></td>
    <td><button class="delete" onclick="deleteRecord('${r.id}')">Delete</button></td>
  </tr>`).join('');
}

async function deleteRecord(id){
  if(prompt('Enter delete password:')!==pass){alert('Incorrect password.');return}
  if(!confirm('Delete this production record?'))return;
  const {error}=await db.from('production_records').delete().eq('id',id);
  if(error){alert(error.message);return}
  await loadRecords();
}

date.valueAsDate=new Date();
['model','storage','color','grade'].forEach(id=>{
  loadOptions(id);
  document.getElementById(id).addEventListener('change',previewStock);
});
date.addEventListener('change',previewStock);
productionQty.addEventListener('input',previewStock);
exportQty.addEventListener('input',previewStock);
loadRecords();
</script>
</body>
</html>
