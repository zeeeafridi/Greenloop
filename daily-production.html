<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Production | Greenloop FZC</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f7f4;
      color: #163d2d;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 8%;
      background: #0b5b38;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .header-logo {
      width: 55px;
      height: 42px;
      object-fit: contain;
    }

    .top-nav {
      padding: 14px 8%;
      display: flex;
      gap: 12px;
      background: #e5f3ea;
    }

    .top-nav a {
      padding: 10px 16px;
      color: #0b5b38;
      background: white;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 35px 20px;
    }

    .form-box, .table-box {
      margin-top: 25px;
      padding: 25px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfd8d2;
      border-radius: 8px;
      font-size: 15px;
    }

    .select-add {
      display: flex;
      gap: 7px;
    }

    .select-add select {
      flex: 1;
    }

    .add-btn {
      padding: 0 13px;
      border: none;
      border-radius: 8px;
      background: #0b5b38;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn {
      margin-top: 24px;
      padding: 13px 28px;
      border: none;
      border-radius: 8px;
      background: #168653;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:hover, .add-btn:hover {
      background: #084429;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e7e4;
      text-align: left;
    }

    th {
      background: #e7f5ec;
    }

    .delete-btn {
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      background: #d84343;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="dashboard.html">← Dashboard</a>
    <a href="index.html">⌂ Home / Login</a>
    <a href="production-report.html">📊 Reports</a>
  </nav>

  <main>
    <h1>Daily Production</h1>
    <p>Enter daily production details below.</p>

    <div class="form-box">
      <div class="form-grid">
        <div>
          <label>Date</label>
          <input type="date" id="date">
        </div>

        <div>
          <label>Model</label>
          <div class="select-add">
            <select id="model"></select>
            <button class="add-btn" type="button" onclick="addOption('model')">+</button>
          </div>
        </div>

        <div>
          <label>Storage / GB</label>
          <div class="select-add">
            <select id="storage"></select>
            <button class="add-btn" type="button" onclick="addOption('storage')">+</button>
          </div>
        </div>

        <div>
          <label>Color</label>
          <div class="select-add">
            <select id="color"></select>
            <button class="add-btn" type="button" onclick="addOption('color')">+</button>
          </div>
        </div>

        <div>
          <label>Grade</label>
          <div class="select-add">
            <select id="grade"></select>
            <button class="add-btn" type="button" onclick="addOption('grade')">+</button>
          </div>
        </div>

        <div>
          <label>Produced Quantity</label>
          <input type="number" id="quantity" min="1" placeholder="Enter quantity">
        </div>
      </div>

      <button class="save-btn" type="button" onclick="saveRecord()">Save Production Record</button>
    </div>

    <div class="table-box">
      <h2>Production Records</h2>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Model</th>
            <th>GB</th>
            <th>Color</th>
            <th>Grade</th>
            <th>Produced Quantity</th>
            <th>Delete</th>
          </tr>
        </thead>

        <tbody id="records"></tbody>
      </table>
    </div>
  </main>

  <script>
    const defaultOptions = {
      model: ["iPhone 13", "Samsung S23"],
      storage: ["64 GB", "128 GB", "256 GB"],
      color: ["Black", "White", "Blue", "Green"],
      grade: ["A", "B", "Bulges A", "Bulges B"]
    };

    function loadOptions(id) {
      const savedOptions = JSON.parse(localStorage.getItem(id + "Options"));
      const options = savedOptions || defaultOptions[id];
      const select = document.getElementById(id);

      select.innerHTML = "";

      options.forEach(function(option) {
        const newOption = document.createElement("option");
        newOption.value = option;
        newOption.textContent = option;
        select.appendChild(newOption);
      });
    }

    function addOption(id) {
      const newValue = prompt("Enter new option:");

      if (newValue && newValue.trim() !== "") {
        const savedOptions = JSON.parse(localStorage.getItem(id + "Options")) || defaultOptions[id];

        if (!savedOptions.includes(newValue.trim())) {
          savedOptions.push(newValue.trim());
          localStorage.setItem(id + "Options", JSON.stringify(savedOptions));
          loadOptions(id);
          document.getElementById(id).value = newValue.trim();
        }
      }
    }

    function saveRecord() {
      const quantity = document.getElementById("quantity").value;

      if (!quantity) {
        alert("Please enter Produced Quantity.");
        return;
      }

      const record = {
        date: document.getElementById("date").value,
        model: document.getElementById("model").value,
        storage: document.getElementById("storage").value,
        color: document.getElementById("color").value,
        grade: document.getElementById("grade").value,
        quantity: quantity
      };

      const records = JSON.parse(localStorage.getItem("productionRecords")) || [];
      records.push(record);
      localStorage.setItem("productionRecords", JSON.stringify(records));

      document.getElementById("quantity").value = "";
      showRecords();
    }

    function showRecords() {
      const records = JSON.parse(localStorage.getItem("productionRecords")) || [];
      const table = document.getElementById("records");

      table.innerHTML = "";

      records.forEach(function(record, index) {
        table.innerHTML += `
          <tr>
            <td>${record.date || ""}</td>
            <td>${record.model || ""}</td>
            <td>${record.storage || ""}</td>
            <td>${record.color || ""}</td>
            <td>${record.grade || ""}</td>
            <td>${record.quantity || ""}</td>
            <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
          </tr>
        `;
      });
    }

    function deleteRecord(index) {
      const records = JSON.parse(localStorage.getItem("productionRecords")) || [];
      records.splice(index, 1);
      localStorage.setItem("productionRecords", JSON.stringify(records));
      showRecords();
    }

    document.getElementById("date").valueAsDate = new Date();

    loadOptions("model");
    loadOptions("storage");
    loadOptions("color");
    loadOptions("grade");
    showRecords();
  </script>
</body>
</html>
