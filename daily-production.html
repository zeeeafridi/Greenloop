<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Production | Greenloop FZC</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f7f4; color: #163d2d; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 8%; background: #0b5b38; color: white; font-size: 22px; font-weight: bold; }
    .header-logo { width: 55px; height: 42px; object-fit: contain; }
    .top-nav { padding: 14px 8%; display: flex; gap: 12px; flex-wrap: wrap; background: #e5f3ea; }
    .top-nav a { padding: 10px 16px; color: #0b5b38; background: white; border-radius: 7px; text-decoration: none; font-weight: bold; }
    main { max-width: 1200px; margin: auto; padding: 35px 20px; }
    .box { margin-top: 25px; padding: 25px; border-radius: 14px; background: white; box-shadow: 0 4px 18px rgba(0,0,0,.08); overflow-x: auto; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
    label { display: block; margin-bottom: 7px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cfd8d2; border-radius: 8px; font-size: 15px; }
    .actions { display: flex; gap: 6px; }
    .actions select { flex: 1; }
    button { border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
    .add { padding: 0 12px; background: #0b5b38; font-size: 20px; }
    .remove, .delete-btn { padding: 7px 10px; background: #d84343; }
    .save { margin-top: 24px; padding: 13px 28px; background: #168653; font-size: 16px; }
    .info { margin-top: 20px; padding: 16px; border-radius: 8px; background: #e7f5ec; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 11px; border-bottom: 1px solid #e2e7e4; text-align: center; }
    th { background: #0b5b38; color: white; }
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="dashboard.html">← Dashboard</a>
    <a href="index.html">⌂ Home / Login</a>
    <a href="production-report.html">📊 Reports</a>
  </nav>

  <main>
    <h1>Daily Production</h1>
    <p>Enter production and export quantities.</p>

    <div class="box">
      <div class="form-grid">
        <div>
          <label>Date</label>
          <input type="date" id="date">
        </div>

        <div>
          <label>Model</label>
          <div class="actions">
            <select id="model"></select>
            <button class="add" onclick="addOption('model')">+</button>
            <button class="remove" onclick="deleteOption('model')">−</button>
          </div>
        </div>

        <div>
          <label>Storage / GB</label>
          <div class="actions">
            <select id="storage"></select>
            <button class="add" onclick="addOption('storage')">+</button>
            <button class="remove" onclick="deleteOption('storage')">−</button>
          </div>
        </div>

        <div>
          <label>Color</label>
          <div class="actions">
            <select id="color"></select>
            <button class="add" onclick="addOption('color')">+</button>
            <button class="remove" onclick="deleteOption('color')">−</button>
          </div>
        </div>

        <div>
          <label>Grade</label>
          <div class="actions">
            <select id="grade"></select>
            <button class="add" onclick="addOption('grade')">+</button>
            <button class="remove" onclick="deleteOption('grade')">−</button>
          </div>
        </div>

        <div>
          <label>Produced Quantity</label>
          <input type="number" id="productionQty" min="0" placeholder="Enter quantity">
        </div>

        <div>
          <label>Export / Out Quantity</label>
          <input type="number" id="exportQty" min="0" value="0">
        </div>
      </div>

      <div class="info">
        <strong>Calculated Day End Stock:</strong>
        <span id="stockPreview">0</span> units
      </div>

      <button class="save" onclick="saveRecord()">Save Daily Production</button>
    </div>

    <div class="box">
      <h2>Daily Production Records</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Model</th><th>GB</th><th>Color</th>
            <th>Grade</th><th>Production</th><th>Export</th>
            <th>Day End Stock</th><th>Delete</th>
          </tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </div>
  </main>

  <script>
    const deletePassword = "1213";

    const defaultOptions = {
      model: ["iPhone 13", "Samsung S23"],
      storage: ["-", "64 GB", "128 GB", "256 GB"],
      color: ["-", "Black", "White", "Blue", "Green"],
      grade: ["A", "B", "Bulges A", "Bulges B"]
    };

    function normalize(value) {
      return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function getRecords() {
      return JSON.parse(localStorage.getItem("productionRecords")) || [];
    }

    function loadOptions(id) {
      const savedOptions = localStorage.getItem(id + "Options");
      const options = savedOptions ? JSON.parse(savedOptions) : [...defaultOptions[id]];
      const unique = [];
      const used = [];

      options.forEach(function(item) {
        const value = normalize(item);
        if (!used.includes(value)) {
          used.push(value);
          unique.push(item.trim());
        }
      });

      localStorage.setItem(id + "Options", JSON.stringify(unique));

      const select = document.getElementById(id);
      select.innerHTML = "";

      unique.forEach(function(item) {
        select.innerHTML += `<option value="${item}">${item}</option>`;
      });
    }

    function addOption(id) {
      const value = prompt("Enter new option:");
      if (!value || value.trim() === "") return;

      const options = JSON.parse(localStorage.getItem(id + "Options")) || [];
      const existing = options.find(item => normalize(item) === normalize(value));

      if (existing) {
        document.getElementById(id).value = existing;
        alert("This option already exists.");
        return;
      }

      options.push(value.trim());
      localStorage.setItem(id + "Options", JSON.stringify(options));
      loadOptions(id);
      document.getElementById(id).value = value.trim();
      updateStockPreview();
    }

    function deleteOption(id) {
      const password = prompt("Enter delete password:");
      if (password !== deletePassword) {
        alert("Incorrect password.");
        return;
      }

      const value = document.getElementById(id).value;
      if (!confirm(`Delete "${value}" from the list?`)) return;

      const options = JSON.parse(localStorage.getItem(id + "Options")) || [];
      const updated = options.filter(item => normalize(item) !== normalize(value));

      localStorage.setItem(id + "Options", JSON.stringify(updated));
      loadOptions(id);
      updateStockPreview();
    }

    function getPreviousStock() {
      const date = document.getElementById("date").value;
      const model = document.getElementById("model").value;
      const storage = document.getElementById("storage").value;
      const color = document.getElementById("color").value;
      const grade = document.getElementById("grade").value;

      const list = getRecords().filter(record =>
        record.date < date &&
        normalize(record.model) === normalize(model) &&
        normalize(record.storage) === normalize(storage) &&
        normalize(record.color) === normalize(color) &&
        normalize(record.grade) === normalize(grade)
      );

      list.sort((a, b) => b.date.localeCompare(a.date));
      return list.length ? Number(list[0].closingStock) || 0 : 0;
    }

    function updateStockPreview() {
      const production = Number(document.getElementById("productionQty").value) || 0;
      const exportQty = Number(document.getElementById("exportQty").value) || 0;
      document.getElementById("stockPreview").textContent =
        getPreviousStock() + production - exportQty;
    }

    function saveRecord() {
      const date = document.getElementById("date").value;
      const model = document.getElementById("model").value;
      const storage = document.getElementById("storage").value;
      const color = document.getElementById("color").value;
      const grade = document.getElementById("grade").value;
      const production = Number(document.getElementById("productionQty").value);
      const exportQty = Number(document.getElementById("exportQty").value) || 0;

      if (!date || Number.isNaN(production)) {
        alert("Please enter Date and Produced Quantity.");
        return;
      }

      const records = getRecords();
      const previousStock = getPreviousStock();

      const index = records.findIndex(record =>
        record.date === date &&
        normalize(record.model) === normalize(model) &&
        normalize(record.storage) === normalize(storage) &&
        normalize(record.color) === normalize(color) &&
        normalize(record.grade) === normalize(grade)
      );

      if (index >= 0) {
        const old = records[index];
        const totalProduction = (Number(old.production) || 0) + production;
        const totalExport = (Number(old.exportQty) || 0) + exportQty;

        records[index] = {
          ...old,
          production: totalProduction,
          exportQty: totalExport,
          closingStock: (Number(old.openingStock) || previousStock) + totalProduction - totalExport
        };
      } else {
        const closingStock = previousStock + production - exportQty;

        if (closingStock < 0) {
          alert("Export quantity is more than available stock.");
          return;
        }

        records.push({
          date, model, storage, color, grade,
          production,
          exportQty,
          openingStock: previousStock,
          closingStock
        });
      }

      localStorage.setItem("productionRecords", JSON.stringify(records));
      document.getElementById("productionQty").value = "";
      document.getElementById("exportQty").value = "0";
      showRecords();
      updateStockPreview();
    }

    function showRecords() {
      const table = document.getElementById("records");
      const records = getRecords().sort((a, b) => b.date.localeCompare(a.date));
      table.innerHTML = "";

      records.forEach(function(record, index) {
        table.innerHTML += `
          <tr>
            <td>${record.date}</td>
            <td>${record.model}</td>
            <td>${record.storage}</td>
            <td>${record.color}</td>
            <td>${record.grade}</td>
            <td>${record.production}</td>
            <td>${record.exportQty}</td>
            <td><strong>${record.closingStock}</strong></td>
            <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
          </tr>
        `;
      });
    }

    function deleteRecord(index) {
      const password = prompt("Enter delete password:");
      if (password !== deletePassword) {
        alert("Incorrect password.");
        return;
      }

      if (!confirm("Delete this production record?")) return;

      const records = getRecords().sort((a, b) => b.date.localeCompare(a.date));
      records.splice(index, 1);
      localStorage.setItem("productionRecords", JSON.stringify(records));
      showRecords();
      updateStockPreview();
    }

    document.getElementById("date").valueAsDate = new Date();

    ["model", "storage", "color", "grade"].forEach(function(id) {
      loadOptions(id);
      document.getElementById(id).addEventListener("change", updateStockPreview);
    });

    document.getElementById("date").addEventListener("change", updateStockPreview);
    document.getElementById("productionQty").addEventListener("input", updateStockPreview);
    document.getElementById("exportQty").addEventListener("input", updateStockPreview);

    showRecords();
    updateStockPreview();
  </script>
</body>
</html>
