<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Process | Greenloop FZC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#f3f7f4;color:#123c2b}
    header{display:flex;align-items:center;gap:12px;padding:14px 8%;background:#0b5b38;color:#fff;font-size:22px;font-weight:bold}
    .header-logo{width:55px;height:42px;object-fit:contain}
    .top-nav{padding:14px 8%;display:flex;gap:12px;flex-wrap:wrap;background:#e5f3ea}
    .top-nav a{padding:10px 16px;color:#0b5b38;background:#fff;border-radius:7px;text-decoration:none;font-weight:bold}
    main{max-width:1250px;margin:auto;padding:35px 20px}
    .box{margin-top:24px;padding:25px;border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}
    .scan-row{display:flex;gap:12px;flex-wrap:wrap}
    .scan-row input{flex:1;min-width:240px}
    input,select,textarea{width:100%;padding:12px;border:1px solid #cfd8d2;border-radius:8px;font-size:15px}
    #scanImei{border:2px solid #168653;font-size:18px;font-weight:bold}
    textarea{resize:vertical;min-height:105px}
    button{border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:bold}
    .find-btn{padding:13px 22px;background:#0b5b38;font-size:15px}
    .save-btn{margin-top:20px;padding:13px 28px;background:#168653;font-size:16px}
    .add-btn{padding:0 13px;background:#0b5b38;font-size:20px}
    .remove-btn,.delete-btn{padding:8px 11px;background:#d84343}
    .field-actions{display:flex;gap:6px}.field-actions select{flex:1}
    .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin-top:22px}
    .detail{padding:14px;border-radius:8px;background:#e7f5ec}
    .detail small{display:block;color:#526c5e;margin-bottom:5px}
    .detail strong{font-size:16px;word-break:break-word}
    .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:22px}
    .full{grid-column:1/-1}
    #status{margin-top:14px;min-height:20px;font-weight:bold}
    .success{color:#0b6e42}.error{color:#c43838}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;margin-top:16px;min-width:1050px}
    th,td{padding:11px;border-bottom:1px solid #e2e7e4;text-align:center}
    th{background:#0b5b38;color:#fff}
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="javascript:history.back()">Back</a>
    <a href="inventory.html">Inventory Control</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="index.html">Home / Login</a>
    <a href="#" onclick="logout();return false;">Logout</a>
  </nav>

  <main>
    <h1>Lab Process</h1>
    <p>Scan IMEI, assign the technician, and complete the lab result.</p>

    <div class="box">
      <div class="scan-row">
        <input type="text" id="scanImei" placeholder="Click here and scan IMEI" inputmode="numeric" autocomplete="off">
        <button class="find-btn" onclick="findImei()">Find IMEI</button>
      </div>

      <div id="status"></div>

      <div class="details">
        <div class="detail"><small>S.No</small><strong id="serialNo">-</strong></div>
        <div class="detail"><small>Model</small><strong id="model">-</strong></div>
        <div class="detail"><small>Storage / GB</small><strong id="storage">-</strong></div>
        <div class="detail"><small>Color</small><strong id="color">-</strong></div>
        <div class="detail"><small>Our Grade</small><strong id="ourGrade">-</strong></div>
        <div class="detail"><small>IMEI</small><strong id="imeiDisplay">-</strong></div>
      </div>

      <div class="form-grid">
        <div>
          <label>Lab Date</label>
          <input type="date" id="labDate">
        </div>

        <div>
          <label>Technician</label>
          <div class="field-actions">
            <select id="technician"></select>
            <button class="add-btn" onclick="addTechnician()">+</button>
            <button class="remove-btn" onclick="deleteTechnician()">−</button>
          </div>
        </div>

        <div>
          <label>Time Taken (Minutes)</label>
          <input type="number" id="timeMinutes" min="0" value="0">
        </div>

        <div>
          <label>Lab Result</label>
          <select id="result">
            <option value="Fixed">Fixed</option>
            <option value="Rework">Not Fixed / Rework</option>
          </select>
        </div>

        <div class="full">
          <label>Work Done</label>
          <textarea id="workDone" placeholder="Enter work completed by technician"></textarea>
        </div>
      </div>

      <button class="save-btn" id="saveButton" onclick="saveLabProcess()" disabled>
        Save Lab Process
      </button>
    </div>

    <div class="box">
      <h2>Lab Process Records</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>S.No</th>
              <th>Model</th>
              <th>IMEI</th>
              <th>Technician</th>
              <th>Work Done</th>
              <th>Time</th>
              <th>Result</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const db = window.supabase.createClient(
      'https://ohvplvdxflmgqoptwftk.supabase.co',
      'sb_publishable_XLlrS0fJoxZTVJkZg46GzA_KnPPPHnH',
      { auth: { experimental: { passkey: true } } }
    );

    let selectedStockIn = null;
    let selectedRepair = null;

    const defaultTechnicians = ['Select Technician'];

    function normalize(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function setStatus(message, type = '') {
      const status = document.getElementById('status');
      status.className = type;
      status.textContent = message;
    }

    function formatDate(value) {
      if (!value) return '';
      const parts = value.split('-');
      return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : value;
    }

    async function loadTechnicians(selected = '') {
      const { data, error } = await db
        .from('production_options')
        .select('value')
        .eq('category', 'technician')
        .order('value');

      const values = [...defaultTechnicians, ...(error ? [] : (data || []).map(item => item.value))];
      const unique = [...new Map(values.map(item => [normalize(item), item])).values()];

      technician.innerHTML = unique
        .map(value => `<option value="${value}">${value}</option>`)
        .join('');

      if (selected) technician.value = selected;
    }

    async function addTechnician() {
      const value = prompt('Enter technician name:');

      if (!value || !value.trim()) return;

      const clean = value.trim();

      const { error } = await db
        .from('production_options')
        .insert({
          category: 'technician',
          value: clean,
          normalized_value: normalize(clean)
        });

      if (error && !error.message.toLowerCase().includes('duplicate')) {
        setStatus(error.message, 'error');
        return;
      }

      await loadTechnicians(clean);
      setStatus('Technician added.', 'success');
    }

    async function deleteTechnician() {
      const value = technician.value;

      if (value === 'Select Technician') return;
      if (!confirm(`Delete "${value}" from the technician list?`)) return;
      if (!await verifyDeleteAccess()) return;

      const { error } = await db
        .from('production_options')
        .delete()
        .eq('category', 'technician')
        .eq('normalized_value', normalize(value));

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      await loadTechnicians();
      setStatus('Technician deleted.', 'success');
    }

    function clearDetails() {
      selectedStockIn = null;
      selectedRepair = null;

      ['serialNo','model','storage','color','ourGrade','imeiDisplay'].forEach(id => {
        document.getElementById(id).textContent = '-';
      });

      workDone.value = '';
      timeMinutes.value = '0';
      result.value = 'Fixed';
      saveButton.disabled = true;
    }

    function showDetails(record) {
      serialNo.textContent = record.serial_no;
      model.textContent = record.model;
      storage.textContent = record.storage;
      color.textContent = record.color;
      ourGrade.textContent = record.our_grade;
      imeiDisplay.textContent = record.imei;
      saveButton.disabled = false;
    }

    async function findImei() {
      const imei = scanImei.value.trim();

      clearDetails();

      if (!imei) {
        setStatus('Scan or enter an IMEI first.', 'error');
        return;
      }

      const { data: phone, error: phoneError } = await db
        .from('quality_stock_in')
        .select('*')
        .eq('imei', imei)
        .maybeSingle();

      if (phoneError || !phone) {
        setStatus('This IMEI was not found in Stock In records.', 'error');
        return;
      }

      const { data: repairs, error: repairError } = await db
        .from('repair_process_records')
        .select('*')
        .eq('stock_in_id', phone.id)
        .in('status', ['Sent to Lab', 'Rework'])
        .order('created_at', { ascending: false })
        .limit(1);

      if (repairError) {
        setStatus(repairError.message, 'error');
        return;
      }

      if (!repairs || !repairs.length) {
        setStatus('This phone has no pending Repair Process record.', 'error');
        return;
      }

      selectedStockIn = phone;
      selectedRepair = repairs[0];

      showDetails(phone);
      setStatus('Repair record found. Enter lab details.', 'success');
    }

    async function addToDailyProduction(phone) {
      const today = labDate.value;
      const { data: allRecords, error } = await db
        .from('production_records')
        .select('*')
        .order('record_date', { ascending: true });

      if (error) throw error;

      const records = allRecords || [];

      const same = record =>
        normalize(record.model) === normalize(phone.model) &&
        normalize(record.storage) === normalize(phone.storage) &&
        normalize(record.color) === normalize(phone.color) &&
        normalize(record.grade) === normalize(phone.our_grade);

      const previous = records
        .filter(record => record.record_date < today && same(record))
        .sort((a, b) => b.record_date.localeCompare(a.record_date))[0];

      const opening = previous ? Number(previous.closing_stock) || 0 : 0;

      const old = records.find(record => record.record_date === today && same(record));

      if (old) {
        const production = (Number(old.production) || 0) + 1;
        const exportQty = Number(old.export_qty) || 0;

        const { error: updateError } = await db
          .from('production_records')
          .update({
            production: production,
            export_qty: exportQty,
            opening_stock: Number(old.opening_stock) || opening,
            closing_stock: (Number(old.opening_stock) || opening) + production - exportQty
          })
          .eq('id', old.id);

        if (updateError) throw updateError;
      } else {
        const { error: insertError } = await db
          .from('production_records')
          .insert({
            record_date: today,
            model: phone.model,
            storage: phone.storage,
            color: phone.color,
            grade: phone.our_grade,
            production: 1,
            export_qty: 0,
            opening_stock: opening,
            closing_stock: opening + 1
          });

        if (insertError) throw insertError;
      }
    }

    async function saveLabProcess() {
      if (!selectedStockIn || !selectedRepair) {
        setStatus('Scan an IMEI first.', 'error');
        return;
      }

      if (technician.value === 'Select Technician') {
        setStatus('Select a technician.', 'error');
        return;
      }

      if (!workDone.value.trim()) {
        setStatus('Enter work done details.', 'error');
        return;
      }

      const labResult = result.value;

      const { error } = await db
        .from('lab_process_records')
        .insert({
          repair_id: selectedRepair.id,
          lab_date: labDate.value,
          technician: technician.value,
          work_done: workDone.value.trim(),
          time_minutes: Number(timeMinutes.value) || 0,
          result: labResult
        });

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      const { error: repairUpdateError } = await db
        .from('repair_process_records')
        .update({ status: labResult === 'Fixed' ? 'Fixed' : 'Rework' })
        .eq('id', selectedRepair.id);

      if (repairUpdateError) {
        setStatus(repairUpdateError.message, 'error');
        return;
      }

      try {
        if (labResult === 'Fixed') {
          await addToDailyProduction(selectedStockIn);
          setStatus('Phone fixed and added to Daily Production.', 'success');
        } else {
          setStatus('Phone marked for Rework.', 'success');
        }
      } catch (error) {
        setStatus(`Lab record saved, but production update failed: ${error.message}`, 'error');
        return;
      }

      scanImei.value = '';
      clearDetails();
      await loadRecords();
      scanImei.focus();
    }

    async function loadRecords() {
      const { data, error } = await db
        .from('lab_process_records')
        .select(`
          *,
          repair_process_records (
            quality_stock_in (
              serial_no,
              model,
              imei
            )
          )
        `)
        .order('created_at', { ascending: false });

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      records.innerHTML = (data || [])
        .map(record => {
          const phone = record.repair_process_records?.quality_stock_in || {};

          return `
            <tr>
              <td>${formatDate(record.lab_date)}</td>
              <td>${phone.serial_no || '-'}</td>
              <td>${phone.model || '-'}</td>
              <td>${phone.imei || '-'}</td>
              <td>${record.technician}</td>
              <td>${record.work_done}</td>
              <td>${record.time_minutes} min</td>
              <td>${record.result}</td>
              <td><button class="delete-btn" onclick="deleteRecord('${record.id}')">Delete</button></td>
            </tr>
          `;
        })
        .join('');
    }

    async function verifyDeleteAccess() {
      const { data: userData } = await db.auth.getUser();
      const user = userData.user;

      if (!user) return false;

      const { data: passkeys, error: passkeyError } = await db.auth.passkey.list();

      if (!passkeyError && (!passkeys || !passkeys.length)) {
        const { error } = await db.auth.registerPasskey();
        if (!error) return true;
      }

      if (!passkeyError && passkeys && passkeys.length) {
        const { error } = await db.auth.signInWithPasskey();
        if (!error) return true;
      }

      const password = prompt('Face verification unavailable. Enter your account password:');

      if (!password) return false;

      const { error } = await db.auth.signInWithPassword({
        email: user.email,
        password: password
      });

      return !error;
    }

    async function deleteRecord(id) {
      if (!confirm('Delete this Lab Process record?')) return;
      if (!await verifyDeleteAccess()) return;

      const { error } = await db
        .from('lab_process_records')
        .delete()
        .eq('id', id);

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      setStatus('Lab Process record deleted.', 'success');
      await loadRecords();
    }

    async function logout() {
      await db.auth.signOut();
      window.location.href = 'index.html';
    }

    db.auth.getSession().then(result => {
      if (!result.data.session) window.location.href = 'index.html';
    });

    labDate.valueAsDate = new Date();

    scanImei.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        findImei();
      }
    });

    loadTechnicians();
    loadRecords();

    setTimeout(() => scanImei.focus(), 700);
  </script>
</body>
</html>
