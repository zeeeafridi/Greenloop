<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Reports | Greenloop FZC</title>

  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f7f4; color: #163d2d; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 8%; background: #0b5b38; color: white; font-size: 22px; font-weight: bold; }
    .header-logo { width: 55px; height: 42px; object-fit: contain; }
    .top-nav { padding: 14px 8%; display: flex; gap: 12px; flex-wrap: wrap; background: #e5f3ea; }
    .top-nav a { padding: 10px 16px; color: #0b5b38; background: white; border-radius: 7px; text-decoration: none; font-weight: bold; }
    main { max-width: 1300px; margin: auto; padding: 35px 20px; }
    .box { margin-top: 25px; padding: 25px; border-radius: 14px; background: white; box-shadow: 0 4px 18px rgba(0,0,0,.08); overflow-x: auto; }
    .filters { display: flex; gap: 15px; align-items: end; flex-wrap: wrap; }
    label { display: block; margin-bottom: 7px; font-weight: bold; }
    input { padding: 11px; border: 1px solid #cfd8d2; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #168653; color: white; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e7e4; text-align: center; }
    th { background: #0b5b38; color: white; }
    td:first-child, th:first-child { text-align: left; }
    tfoot td { background: #e7f5ec; font-weight: bold; }
    .empty { padding: 18px; text-align: center; color: #777; }
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="daily-production.html">← Daily Production</a>
    <a href="dashboard.html">⌂ Dashboard</a>
    <a href="index.html">Home / Login</a>
  </nav>

  <main>
    <h1>Daily Production Reports</h1>

    <div class="box">
      <div class="filters">
        <div>
          <label>From Date</label>
          <input type="date" id="fromDate">
        </div>

        <div>
          <label>To Date</label>
          <input type="date" id="toDate">
        </div>

        <button onclick="showReport()">Show Report</button>
      </div>
    </div>

    <div class="box">
      <h2>Closing Stock Summary</h2>

      <table>
        <thead>
          <tr>
            <th>Model</th>
            <th>GB</th>
            <th>Color</th>
            <th>Grade A</th>
            <th>Grade B</th>
            <th>Bulges A</th>
            <th>Bulges B</th>
            <th>Total Stock</th>
          </tr>
        </thead>

        <tbody id="stockTable"></tbody>
        <tfoot id="stockTotals"></tfoot>
      </table>
    </div>

    <div class="box">
      <h2>Date-wise Production Details</h2>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Model</th>
            <th>GB</th>
            <th>Color</th>
            <th>Grade</th>
            <th>Production</th>
            <th>Export</th>
            <th>Day End Stock</th>
          </tr>
        </thead>

        <tbody id="detailsTable"></tbody>
        <tfoot id="productionTotals"></tfoot>
      </table>

      <div id="emptyMessage" class="empty"></div>
    </div>
  </main>

  <script>
    function getRecords() {
      return JSON.parse(localStorage.getItem("productionRecords")) || [];
    }

    function showReport() {
      const fromDate = document.getElementById("fromDate").value || "0000-01-01";
      const toDate = document.getElementById("toDate").value || "9999-12-31";
      const allRecords = getRecords();

      const filteredRecords = allRecords.filter(function(record) {
        return record.date >= fromDate && record.date <= toDate;
      });

      filteredRecords.sort(function(a, b) {
        return a.date.localeCompare(b.date);
      });

      const detailsTable = document.getElementById("detailsTable");
      const productionTotals = document.getElementById("productionTotals");
      const emptyMessage = document.getElementById("emptyMessage");

      detailsTable.innerHTML = "";
      productionTotals.innerHTML = "";
      emptyMessage.textContent = "";

      let totalProduction = 0;
      let totalExport = 0;

      filteredRecords.forEach(function(record) {
        const production = Number(record.production) || Number(record.quantity) || 0;
        const exportQty = Number(record.exportQty) || 0;

        totalProduction += production;
        totalExport += exportQty;

        detailsTable.innerHTML += `
          <tr>
            <td>${record.date}</td>
            <td>${record.model}</td>
            <td>${record.storage}</td>
            <td>${record.color}</td>
            <td>${record.grade}</td>
            <td>${production}</td>
            <td>${exportQty}</td>
            <td>${record.closingStock ?? ""}</td>
          </tr>
        `;
      });

      if (filteredRecords.length === 0) {
        emptyMessage.textContent = "No records available for the selected dates.";
      } else {
        productionTotals.innerHTML = `
          <tr>
            <td colspan="5">Grand Total</td>
            <td>${totalProduction}</td>
            <td>${totalExport}</td>
            <td></td>
          </tr>
        `;
      }

      const latestByGrade = {};

      allRecords.forEach(function(record) {
        if (record.date <= toDate && record.closingStock !== undefined) {
          const key = record.model + "|" + record.storage + "|" + record.color + "|" + record.grade;

          if (!latestByGrade[key] || latestByGrade[key].date <= record.date) {
            latestByGrade[key] = record;
          }
        }
      });

      const stockSummary = {};

      Object.values(latestByGrade).forEach(function(record) {
        const key = record.model + "|" + record.storage + "|" + record.color;

        if (!stockSummary[key]) {
          stockSummary[key] = {
            model: record.model,
            storage: record.storage,
            color: record.color,
            gradeA: 0,
            gradeB: 0,
            bulgesA: 0,
            bulgesB: 0
          };
        }

        const stock = Number(record.closingStock) || 0;

        if (record.grade === "A") stockSummary[key].gradeA += stock;
        if (record.grade === "B") stockSummary[key].gradeB += stock;
        if (record.grade === "Bulges A") stockSummary[key].bulgesA += stock;
        if (record.grade === "Bulges B") stockSummary[key].bulgesB += stock;
      });

      const stockTable = document.getElementById("stockTable");
      const stockTotals = document.getElementById("stockTotals");

      stockTable.innerHTML = "";
      stockTotals.innerHTML = "";

      let totalA = 0;
      let totalB = 0;
      let totalBulgesA = 0;
      let totalBulgesB = 0;

      Object.values(stockSummary).forEach(function(item) {
        const totalStock = item.gradeA + item.gradeB + item.bulgesA + item.bulgesB;

        totalA += item.gradeA;
        totalB += item.gradeB;
        totalBulgesA += item.bulgesA;
        totalBulgesB += item.bulgesB;

        stockTable.innerHTML += `
          <tr>
            <td>${item.model}</td>
            <td>${item.storage}</td>
            <td>${item.color}</td>
            <td>${item.gradeA}</td>
            <td>${item.gradeB}</td>
            <td>${item.bulgesA}</td>
            <td>${item.bulgesB}</td>
            <td><strong>${totalStock}</strong></td>
          </tr>
        `;
      });

      const grandTotal = totalA + totalB + totalBulgesA + totalBulgesB;

      stockTotals.innerHTML = `
        <tr>
          <td colspan="3">Grand Total</td>
          <td>${totalA}</td>
          <td>${totalB}</td>
          <td>${totalBulgesA}</td>
          <td>${totalBulgesB}</td>
          <td>${grandTotal}</td>
        </tr>
      `;
    }

    document.getElementById("toDate").valueAsDate = new Date();
    showReport();
  </script>
</body>
</html>
