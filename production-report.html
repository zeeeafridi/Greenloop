<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production Reports | Greenloop FZC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f3f7f4;color:#163d2d}header{padding:14px 8%;background:#0b5b38;color:#fff;font-size:22px;font-weight:bold}.logo{width:55px;height:42px;object-fit:contain;vertical-align:middle;margin-right:12px}nav{padding:14px 8%;background:#e5f3ea}nav a{padding:10px 16px;background:#fff;color:#0b5b38;border-radius:7px;text-decoration:none;font-weight:bold;margin-right:8px}main{max-width:1300px;margin:auto;padding:35px 20px}.box{padding:25px;margin-top:25px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #0002;overflow:auto}.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap}label{display:block;font-weight:bold;margin-bottom:7px}input{padding:11px;border:1px solid #cfd8d2;border-radius:8px}button{padding:12px 20px;border:0;border-radius:8px;background:#168653;color:#fff;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:center}th{background:#0b5b38;color:#fff}tfoot td{background:#e7f5ec;font-weight:bold}
</style>
</head>
<body>
<header><img src="looplogo.jpg" class="logo">Greenloop FZC</header>
<nav>
<a href="daily-production.html">← Daily Production</a>
<a href="dashboard.html">⌂ Dashboard</a>
<a href="index.html">Home / Login</a>
</nav>

<main>
<h1>Daily Production Reports</h1>

<div class="box">
<div class="filters">
<div><label>From Date</label><input type="date" id="fromDate"></div>
<div><label>To Date</label><input type="date" id="toDate"></div>
<button onclick="showReport()">Show Report</button>
</div>
</div>

<div class="box">
<h2>Closing Stock Summary</h2>
<table>
<thead><tr><th>Model</th><th>GB</th><th>Color</th><th>Grade A</th><th>Grade B</th><th>Bulges A</th><th>Bulges B</th><th>Total Stock</th></tr></thead>
<tbody id="stockRows"></tbody>
<tfoot id="stockTotals"></tfoot>
</table>
</div>

<div class="box">
<h2>Date-wise Production Details</h2>
<table>
<thead><tr><th>Date</th><th>Model</th><th>GB</th><th>Color</th><th>Grade</th><th>Production</th><th>Export</th><th>Day End Stock</th></tr></thead>
<tbody id="detailRows"></tbody>
<tfoot id="detailTotals"></tfoot>
</table>
</div>
</main>

<script>
const db=window.supabase.createClient(
'https://ohvplvdxflmgqoptwftk.supabase.co',
'sb_publishable_XLlrS0fJoxZTVJkZg46GzA_KnPPPHnH'
);

async function showReport(){
  const from=fromDate.value||'0000-01-01';
  const to=toDate.value||'9999-12-31';

  const {data,error}=await db.from('production_records').select('*').order('record_date',{ascending:true});

  if(error){alert(error.message);return}

  const all=data||[];
  const filtered=all.filter(r=>r.record_date>=from&&r.record_date<=to);

  let productionTotal=0;
  let exportTotal=0;

  detailRows.innerHTML=filtered.map(r=>{
    productionTotal+=Number(r.production)||0;
    exportTotal+=Number(r.export_qty)||0;

    return `<tr>
      <td>${r.record_date}</td><td>${r.model}</td><td>${r.storage}</td>
      <td>${r.color}</td><td>${r.grade}</td><td>${r.production}</td>
      <td>${r.export_qty}</td><td>${r.closing_stock}</td>
    </tr>`;
  }).join('');

  detailTotals.innerHTML=`
    <tr>
      <td colspan="5">Grand Total</td>
      <td>${productionTotal}</td>
      <td>${exportTotal}</td>
      <td></td>
    </tr>`;

  const latest={};

  all.filter(r=>r.record_date<=to).forEach(r=>{
    const key=[r.model,r.storage,r.color,r.grade].join('|').toLowerCase();

    if(!latest[key]||latest[key].record_date<=r.record_date){
      latest[key]=r;
    }
  });

  const summary={};

  Object.values(latest).forEach(r=>{
    const key=[r.model,r.storage,r.color].join('|').toLowerCase();

    if(!summary[key]){
      summary[key]={
        model:r.model,storage:r.storage,color:r.color,
        a:0,b:0,bulgesA:0,bulgesB:0
      };
    }

    const stock=Number(r.closing_stock)||0;

    if(r.grade==='A')summary[key].a+=stock;
    if(r.grade==='B')summary[key].b+=stock;
    if(r.grade==='Bulges A')summary[key].bulgesA+=stock;
    if(r.grade==='Bulges B')summary[key].bulgesB+=stock;
  });

  let a=0,b=0,ba=0,bb=0;

  stockRows.innerHTML=Object.values(summary).map(x=>{
    a+=x.a;b+=x.b;ba+=x.bulgesA;bb+=x.bulgesB;

    return `<tr>
      <td>${x.model}</td><td>${x.storage}</td><td>${x.color}</td>
      <td>${x.a}</td><td>${x.b}</td>
      <td>${x.bulgesA}</td><td>${x.bulgesB}</td>
      <td><strong>${x.a+x.b+x.bulgesA+x.bulgesB}</strong></td>
    </tr>`;
  }).join('');

  stockTotals.innerHTML=`
    <tr>
      <td colspan="3">Grand Total</td>
      <td>${a}</td><td>${b}</td><td>${ba}</td><td>${bb}</td>
      <td>${a+b+ba+bb}</td>
    </tr>`;
}

toDate.valueAsDate=new Date();
showReport();
</script>
</body>
</html>
