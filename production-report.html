<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Reports | Greenloop FZC</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f7f4;
      color: #163d2d;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 8%;
      background: #0b5b38;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .header-logo {
      width: 55px;
      height: 42px;
      object-fit: contain;
    }

    .top-nav {
      padding: 14px 8%;
      display: flex;
      gap: 12px;
      background: #e5f3ea;
    }

    .top-nav a {
      padding: 10px 16px;
      color: #0b5b38;
      background: white;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .report-box {
      padding: 25px;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #e2e7e4;
      text-align: center;
    }

    th {
      background: #0b5b38;
      color: white;
    }

    td:first-child, th:first-child {
      text-align: left;
    }

    .empty {
      padding: 20px;
      text-align: center;
      color: #777;
    }
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="daily-production.html">← Daily Production</a>
    <a href="dashboard.html">⌂ Dashboard</a>
    <a href="index.html">Home / Login</a>
  </nav>

  <main>
    <h1>Daily Production Reports</h1>
    <p>Model-wise production stock summary.</p>

    <div class="report-box">
      <table>
        <thead>
          <tr>
            <th>Model</th>
            <th>Grade A</th>
            <th>Grade B</th>
            <th>Bulges A</th>
            <th>Bulges B</th>
            <th>Total</th>
          </tr>
        </thead>

        <tbody id="reportTable"></tbody>
      </table>

      <div id="emptyMessage" class="empty"></div>
    </div>
  </main>

  <script>
    function showReport() {
      const records = JSON.parse(localStorage.getItem("productionRecords")) || [];
      const report = {};

      records.forEach(function(record) {
        const model = record.model || "Unknown Model";
        const grade = record.grade || "";
        const quantity = Number(record.quantity) || 0;

        if (!report[model]) {
          report[model] = {
            gradeA: 0,
            gradeB: 0,
            bulgesA: 0,
            bulgesB: 0
          };
        }

        if (grade === "A") {
          report[model].gradeA += quantity;
        }

        if (grade === "B") {
          report[model].gradeB += quantity;
        }

        if (grade === "Bulges A") {
          report[model].bulgesA += quantity;
        }

        if (grade === "Bulges B") {
          report[model].bulgesB += quantity;
        }
      });

      const table = document.getElementById("reportTable");
      const emptyMessage = document.getElementById("emptyMessage");

      table.innerHTML = "";
      emptyMessage.textContent = "";

      const models = Object.keys(report);

      if (models.length === 0) {
        emptyMessage.textContent = "No production records available yet.";
        return;
      }

      models.forEach(function(model) {
        const item = report[model];
        const total = item.gradeA + item.gradeB + item.bulgesA + item.bulgesB;

        table.innerHTML += `
          <tr>
            <td>${model}</td>
            <td>${item.gradeA}</td>
            <td>${item.gradeB}</td>
            <td>${item.bulgesA}</td>
            <td>${item.bulgesB}</td>
            <td><strong>${total}</strong></td>
          </tr>
        `;
      });
    }

    showReport();
  </script>
</body>
</html>
