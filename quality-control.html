<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quality Control | Greenloop FZC</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f7f4;
      color: #123c2b;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 8%;
      background: #0b5b38;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .header-logo {
      width: 55px;
      height: 42px;
      object-fit: contain;
    }

    .top-nav {
      padding: 14px 8%;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      background: #e5f3ea;
    }

    .top-nav a {
      padding: 10px 16px;
      color: #0b5b38;
      background: white;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 45px 20px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 34px;
    }

    .subtitle {
      margin-top: 0;
      color: #49685a;
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-top: 35px;
    }

    .card {
      display: block;
      padding: 42px 25px;
      text-align: center;
      text-decoration: none;
      color: #123c2b;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }

    .icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e4f5eb;
      color: #0b5b38;
      font-size: 44px;
      font-weight: bold;
    }

    .card h2 {
      margin: 0 0 10px;
      color: #0b5b38;
      font-size: 25px;
    }

    .card p {
      margin: 0;
      line-height: 1.5;
      color: #526c5e;
    }

    @media (max-width: 600px) {
      main {
        padding: 32px 16px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="index.html">Home / Login</a>
  </nav>

  <main>
    <h1>Quality Control</h1>
    <p class="subtitle">Manage incoming and outgoing stock.</p>

    <div class="cards">
      <a href="stock-in.html" class="card">
        <div class="icon">↓</div>
        <h2>Stock In</h2>
        <p>Receive and inspect new stock using IMEI scanning.</p>
      </a>

      <a href="stock-out.html" class="card">
        <div class="icon">↑</div>
        <h2>Stock Out</h2>
        <p>Manage stock issued or dispatched from quality control.</p>
      </a>
    </div>
  </main>
</body>
</html>
