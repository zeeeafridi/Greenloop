<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Out | Greenloop FZC</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#f3f7f4;color:#123c2b}
    header{display:flex;align-items:center;gap:12px;padding:14px 8%;background:#0b5b38;color:#fff;font-size:22px;font-weight:bold}
    .header-logo{width:55px;height:42px;object-fit:contain}
    .top-nav{padding:14px 8%;display:flex;gap:12px;flex-wrap:wrap;background:#e5f3ea}
    .top-nav a{padding:10px 16px;color:#0b5b38;background:#fff;border-radius:7px;text-decoration:none;font-weight:bold}
    main{max-width:1200px;margin:auto;padding:35px 20px}
    .box{margin-top:24px;padding:25px;border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}
    .scan-row{display:flex;gap:12px;flex-wrap:wrap}
    .scan-row input{flex:1;min-width:240px}
    input{padding:13px;border:2px solid #168653;border-radius:8px;font-size:18px;font-weight:bold}
    button{border:0;border-radius:8px;color:#fff;cursor:pointer;font-weight:bold}
    .find-btn{padding:13px 22px;background:#0b5b38;font-size:15px}
    .save-btn{margin-top:20px;padding:13px 28px;background:#168653;font-size:16px}
    .delete-btn{padding:8px 11px;background:#d84343}
    .details{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;margin-top:22px}
    .detail{padding:14px;border-radius:8px;background:#e7f5ec}
    .detail small{display:block;color:#526c5e;margin-bottom:5px}
    .detail strong{font-size:16px;word-break:break-word}
    #status{margin-top:14px;min-height:20px;font-weight:bold}
    .success{color:#0b6e42}.error{color:#c43838}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;margin-top:16px;min-width:1000px}
    th,td{padding:11px;border-bottom:1px solid #e2e7e4;text-align:center}
    th{background:#0b5b38;color:#fff}
    @media(max-width:650px){main{padding:28px 14px}.box{padding:18px}}
  </style>
</head>

<body>
  <header>
    <img src="looplogo.jpg" alt="Greenloop Logo" class="header-logo">
    Greenloop FZC
  </header>

  <nav class="top-nav">
    <a href="javascript:history.back()">Back</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="quality-control.html">Quality Control</a>
    <a href="stock-in.html">Stock In</a>
    <a href="index.html">Home / Login</a>
    <a href="#" onclick="logout();return false;">Logout</a>
  </nav>

  <main>
    <h1>Stock Out</h1>
    <p>Scan the IMEI to find the Stock In record automatically.</p>

    <div class="box">
      <div class="scan-row">
        <input type="text" id="scanImei" placeholder="Click here and scan IMEI" inputmode="numeric" autocomplete="off">
        <button class="find-btn" onclick="findImei()">Find IMEI</button>
      </div>

      <div id="status"></div>

      <div class="details">
        <div class="detail"><small>S.No</small><strong id="serialNo">-</strong></div>
        <div class="detail"><small>Model</small><strong id="model">-</strong></div>
        <div class="detail"><small>Storage / GB</small><strong id="storage">-</strong></div>
        <div class="detail"><small>Color</small><strong id="color">-</strong></div>
        <div class="detail"><small>Supplier Grade</small><strong id="supplierGrade">-</strong></div>
        <div class="detail"><small>Our Grade</small><strong id="ourGrade">-</strong></div>
        <div class="detail"><small>IMEI</small><strong id="imeiDisplay">-</strong></div>
      </div>

      <button class="save-btn" id="saveButton" onclick="saveStockOut()" disabled>
        Save Stock Out
      </button>
    </div>

    <div class="box">
      <h2>Stock Out Records</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th>Date</th>
              <th>Model</th>
              <th>GB</th>
              <th>Color</th>
              <th>IMEI</th>
              <th>Supplier Grade</th>
              <th>Our Grade</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const db = window.supabase.createClient(
      'https://ohvplvdxflmgqoptwftk.supabase.co',
      'sb_publishable_XLlrS0fJoxZTVJkZg46GzA_KnPPPHnH',
      {
        auth: {
          experimental: {
            passkey: true
          }
        }
      }
    );

    let selectedStockIn = null;

    function setStatus(message, type = '') {
      const status = document.getElementById('status');
      status.className = type;
      status.textContent = message;
    }

    function clearDetails() {
      selectedStockIn = null;

      document.getElementById('serialNo').textContent = '-';
      document.getElementById('model').textContent = '-';
      document.getElementById('storage').textContent = '-';
      document.getElementById('color').textContent = '-';
      document.getElementById('supplierGrade').textContent = '-';
      document.getElementById('ourGrade').textContent = '-';
      document.getElementById('imeiDisplay').textContent = '-';
      document.getElementById('saveButton').disabled = true;
    }

    function showDetails(record) {
      document.getElementById('serialNo').textContent = record.serial_no;
      document.getElementById('model').textContent = record.model;
      document.getElementById('storage').textContent = record.storage;
      document.getElementById('color').textContent = record.color;
      document.getElementById('supplierGrade').textContent = record.supplier_grade;
      document.getElementById('ourGrade').textContent = record.our_grade;
      document.getElementById('imeiDisplay').textContent = record.imei;
      document.getElementById('saveButton').disabled = false;
    }

    async function findImei() {
      const imei = document.getElementById('scanImei').value.trim();

      clearDetails();

      if (!imei) {
        setStatus('Scan or enter an IMEI first.', 'error');
        return;
      }

      setStatus('Searching Stock In records...');

      const { data: stockIn, error: stockInError } = await db
        .from('quality_stock_in')
        .select('*')
        .eq('imei', imei)
        .maybeSingle();

      if (stockInError) {
        setStatus(stockInError.message, 'error');
        return;
      }

      if (!stockIn) {
        setStatus('This IMEI was not found in Stock In records.', 'error');
        return;
      }

      const { data: alreadyOut, error: outError } = await db
        .from('quality_stock_out')
        .select('id')
        .eq('stock_in_id', stockIn.id)
        .maybeSingle();

      if (outError) {
        setStatus(outError.message, 'error');
        return;
      }

      if (alreadyOut) {
        setStatus('This IMEI has already been marked as Stock Out.', 'error');
        return;
      }

      selectedStockIn = stockIn;
      showDetails(stockIn);
      setStatus('Stock In record found. Check details, then save Stock Out.', 'success');
    }

    async function saveStockOut() {
      if (!selectedStockIn) {
        setStatus('Scan an IMEI first.', 'error');
        return;
      }

      const { error } = await db
        .from('quality_stock_out')
        .insert({
          stock_in_id: selectedStockIn.id,
          out_date: new Date().toISOString().slice(0, 10),
          serial_no: selectedStockIn.serial_no,
          model: selectedStockIn.model,
          storage: selectedStockIn.storage,
          color: selectedStockIn.color,
          imei: selectedStockIn.imei,
          supplier_grade: selectedStockIn.supplier_grade,
          our_grade: selectedStockIn.our_grade
        });

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      setStatus('Stock Out record saved.', 'success');

      document.getElementById('scanImei').value = '';
      clearDetails();

      await loadRecords();

      document.getElementById('scanImei').focus();
    }

    function formatDate(value) {
      if (!value) return '';

      const parts = value.split('-');

      return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : value;
    }

    async function loadRecords() {
      const { data, error } = await db
        .from('quality_stock_out')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      document.getElementById('records').innerHTML = (data || [])
        .map(record => `
          <tr>
            <td>${record.serial_no}</td>
            <td>${formatDate(record.out_date)}</td>
            <td>${record.model}</td>
            <td>${record.storage}</td>
            <td>${record.color}</td>
            <td>${record.imei}</td>
            <td>${record.supplier_grade}</td>
            <td>${record.our_grade}</td>
            <td>
              <button class="delete-btn" onclick="deleteRecord('${record.id}')">Delete</button>
            </td>
          </tr>
        `)
        .join('');
    }

    async function verifyDeleteAccess() {
      const { data: userData } = await db.auth.getUser();
      const user = userData.user;

      if (!user) {
        setStatus('Please log in again.', 'error');
        return false;
      }

      const { data: passkeys, error: passkeyError } = await db.auth.passkey.list();

      if (!passkeyError && (!passkeys || !passkeys.length)) {
        setStatus('Set up Windows Hello Face or PIN.');

        const { error } = await db.auth.registerPasskey();

        if (!error) return true;
      }

      if (!passkeyError && passkeys && passkeys.length) {
        const { error } = await db.auth.signInWithPasskey();

        if (!error) return true;
      }

      const password = prompt('Face verification unavailable. Enter your account password:');

      if (!password) return false;

      const { error } = await db.auth.signInWithPassword({
        email: user.email,
        password: password
      });

      if (error) {
        setStatus('Incorrect account password.', 'error');
        return false;
      }

      return true;
    }

    async function deleteRecord(id) {
      if (!confirm('Delete this Stock Out record?')) return;
      if (!await verifyDeleteAccess()) return;

      const { error } = await db
        .from('quality_stock_out')
        .delete()
        .eq('id', id);

      if (error) {
        setStatus(error.message, 'error');
        return;
      }

      setStatus('Record deleted. This IMEI can be scanned again.', 'success');
      await loadRecords();
    }

    async function logout() {
      await db.auth.signOut();
      window.location.href = 'index.html';
    }

    db.auth.getSession().then(result => {
      if (!result.data.session) {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('scanImei').addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        findImei();
      }
    });

    loadRecords();

    setTimeout(function() {
      document.getElementById('scanImei').focus();
    }, 700);
  </script>
</body>
</html>
