  <style>

    main{max-width:1050px;margin:auto;padding:45px 20px}
    .box{margin-top:25px;padding:32px;border-radius:14px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}

<body>

  <script>
    const db = window.supabase.createClient(
      'https://ohvplvdxflmgqoptwftk.supabase.co',
      'sb_publishable_XLlrS0fJoxZTVJkZg46GzA_KnPPPHnH'
    );

    async function logout() {
      await db.auth.signOut();
      window.location.href = 'index.html';

    db.auth.getSession().then(function(result) {
      if (!result.data.session) {
        window.location.href = 'index.html';
      }
    });
