<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenloop FZC Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f7f4;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 8%;
      background: #0b5b38;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .logo {
      width: 38px;
      height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid white;
      border-radius: 50%;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 50px 25px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #123f2e;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }

    .card {
      padding: 35px 20px;
      border-radius: 16px;
      background: white;
      color: #123f2e;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
      transition: 0.25s;
    }

    .card:hover {
      transform: translateY(-8px);
      background: #e8f7ef;
    }

    .icon {
      font-size: 56px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <header>
<img src="looplogo.jpg" alt="Greenloop Logo" class="logo">    Greenloop FZC
  </header>

  <main>
    <h1>Dashboard</h1>
    <p>Select a section to continue</p>

    <div class="cards">
      <a class="card" href="inventory.html">
        <div class="icon">📦</div>
        <h2>Inventory</h2>
      </a>

      <a class="card" href="quality-control.html">
        <div class="icon">✓</div>
        <h2>Quality Control</h2>
      </a>

      <a class="card" href="daily-production.html">
        <div class="icon">🏭</div>
        <h2>Daily Production</h2>
      </a>
    </div>
  </main>
</body>
</html>
